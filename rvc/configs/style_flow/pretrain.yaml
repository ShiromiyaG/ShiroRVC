inherit: base.yaml

# The fine-tune's threshold, so the base learns the same attacks and phrase
# ends; at 0.03 weak tails read as drops.
frontend:
  voicing_threshold: 0.5

data:
  # Speaker ids that are speech (EARS) rather than singing, as "a-b" ranges
  # or single ids.
  speech_speakers: ["0-4"]
  max_speech_fraction: 0.15
  val_clips: 64
  max_frames: 1500

augment:
  prob: 0.8
  vibrato_extent: [0.5, 2.0]
  vibrato_rate: [0.8, 1.25]
  scoop_prob: 0.5
  scoop_gain: [0.0, 2.5]
  scoop_add_prob: 0.5
  scoop_add_cents: [60.0, 600.0]
  scoop_add_seconds: [0.05, 0.35]
  drop_prob: 0.5
  # Close to the data, whose falling ends have a median of -77 cents: at
  # 2.5x and 400 cents the model fell ~3x deeper than the validation clips.
  drop_gain: [0.0, 1.5]
  drop_add_prob: 0.5
  drop_add_cents: [40.0, 200.0]
  drop_add_seconds: [0.1, 0.3]
  coarse_shift_semitones: 3.0
  # Mostly narrower: the sources at inference are usually mixed, compressed vocals.
  loudness_scale: [0.5, 1.5]

# The converter learns from each clip re-sung by these draws, rewriting it
# back; broad, so any singer's residual at inference is one it has seen the like of.
converter:
  source_dropout: 0.25
  degrade:
    vibrato_extent: [0.1, 1.6]
    vibrato_rate: [0.75, 1.3]
    scoop_prob: 1.0
    scoop_gain: [0.0, 2.0]
    # Sources missing the target's scoops or drops, so the descriptors, not
    # the source, decide how many there are.
    scoop_flat_prob: 0.35
    scoop_remove_prob: 0.3
    scoop_add_prob: 0.5
    drop_prob: 1.0
    drop_gain: [0.0, 2.0]
    drop_flat_prob: 0.35
    drop_remove_prob: 0.3
    drop_add_prob: 0.5
    transition_prob: 0.8
    transition_time: [0.5, 2.0]
    overshoot_prob: 0.8
    overshoot_gain: [0.0, 2.0]
    overshoot_add_prob: 0.4

# Multi-period discriminator on the vibrato band of the flow's one-step
# estimate, conditioned on the descriptors, so vibrato comes out as deep and
# regular as they ask rather than averaged.
# Not exported; a fine-tune trains without it unless its config enables it.
discriminator:
  # Off: on the converter base it sat at chance, its vibrato already real,
  # and cost ~15% of the step.
  enabled: false
  periods: [2, 3, 5, 7, 11]
  lr: 2.0e-4
  # The discriminator trains from the start; the model feels it from here
  # (counted from the resume, when a checkpoint predates this discriminator).
  start_step: 5000
  # Estimates from earlier t are rightly an average of possible vibratos.
  t_min: 0.5
  adv_weight: 0.05
  fm_weight: 0.1

train:
  batch_size: 16
  steps: 100000
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 2000
  min_lr_ratio: 0.1
  grad_clip: 1.0
  ema_decay: 0.9995
  unit_dropout: 0.15
  descriptor_dropout: 0.15
  descriptor_dim_dropout: 0.1
  t_logit_mean: 0.0
  t_logit_std: 1.0
  # bf16, fp16 (autocast + GradScaler over FP32 weights) or fp32.
  precision: bf16
  tf32: true
  # Recompute block activations in backward: less VRAM, slower steps.
  checkpointing: false
  # torch.compile the training forward; off with checkpointing.
  compile: false
  num_workers: 6
  log_every: 100
  val_every: 5000
  keep_checkpoints: 3
  seed: 0

validation:
  sample_clips: 16
  steps: 32
  cfg_scale: 2.0
  cfg_drop: descriptors
  # Each clip generated with its own descriptors.
  condition: clip
  plot_clips: 3
  # Descriptor -> direction; a deeper fall is a more negative depth, and the
  # fraction of falling phrase ends rises with it.
  response_groups:
    vibrato_extent: {vibrato_extent_cents: 1}
    vibrato_rate: {vibrato_rate_hz: 1}
    scoop: {scoop_fraction: 1}
    phrase_end_drop: {phrase_end_drop_depth_cents: -1, phrase_end_drop_fraction: 1}
  response_offset: 1.5
