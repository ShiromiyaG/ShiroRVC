name: CI

# Runs on every push and pull request.
#
# This exists because the release workflow used to be the only one: it triggers
# on a VERSION change, so the test suite ran roughly once per release and the
# first sign that a commit had broken something arrived while trying to publish
# it.  The checks here are the cheap half -- ubuntu, about a minute -- and the
# expensive Windows installer build lives in build-windows.yml, which fires only
# when the installer itself changes.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml gates publishing on these same checks rather than restating
  # them, so the suite a release must pass is the suite every commit runs.
  workflow_call:

# A newer push makes an in-flight run of the same branch pointless.  Releases
# are not cancelled this way -- release.yml sets its own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 ships its own Qt build, but that Qt links against the system
      # EGL, GL and xkbcommon, and the runner images do not carry them.  The
      # link happens when ``PySide6.QtGui`` loads, which is before any platform
      # plugin is chosen -- so ``QT_QPA_PLATFORM=offscreen`` below does not
      # avoid it, and the failure is an ImportError at collection rather than a
      # skip.
      #
      # ``libpulse0`` is for QtMultimedia, which the audio player imports and
      # which links PulseAudio even when nothing is played: the tests only
      # construct the widget.  GStreamer is not needed -- Qt dlopens it when
      # playback actually starts, which no test reaches.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0

      # The isolation, version and identity tests parse imports with ast and
      # never execute the GUI. Qt is installed on top so the behavioural tests --
      # the wheel guard, the Gradio-matching defaults -- run too; they skip
      # themselves cleanly if it is missing.
      # pytest 8.2 for ``importorskip(exc_type=...)``: the Qt guards need to
      # catch a plain ImportError, and the default only catches
      # ModuleNotFoundError -- which is why a missing system library used to
      # abort collection instead of skipping.
      #
      # click, psutil and rich are the whole of ``core``'s third-party import
      # list.  They are here so the tests that read the CLI's own defaults and
      # signatures can import it: those compare the backend against the GUI,
      # and skipping them is the same as not having them.  Nothing here pulls
      # in torch -- ``core`` imports it lazily, and test_gui_isolation asserts
      # that it stays that way.
      - run: pip install "pytest>=8.2" "PySide6>=6.7,<7" click psutil rich

      - name: gui/ stays deletable, one version, one app name, wheel guard holds
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
