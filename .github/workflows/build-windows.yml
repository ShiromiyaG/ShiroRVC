name: Windows installer

# The Windows setup executable, defined once.
#
# Two callers: release.yml reuses it through ``workflow_call`` to produce the
# published artifact, and the ``push``/``pull_request`` triggers below run it
# whenever the installer's own code changes.  Keeping one definition is the
# point -- a build that only ever ran at release time is a build whose breakage
# is discovered at release time, and a second copy of these steps would drift
# from this one the way two copies always do.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to bake into the installer. Empty builds a development installer."
        type: string
        required: false
        default: ""
      upload:
        description: "Publish the build as a workflow artifact."
        type: boolean
        required: false
        default: false
    outputs:
      app_name:
        description: "Application name the build used, read from version.py."
        value: ${{ jobs.build.outputs.app_name }}
  push:
    paths:
      - "installer/**"
      - "version.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "installer/**"
      - "version.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test
    runs-on: windows-latest
    outputs:
      app_name: ${{ steps.identity.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r installer/requirements-bootstrap.txt

      # Read rather than restate. The archive name and the URL the wizard will
      # download from are built from this string in two different languages; a
      # literal here is the copy no test can reach.
      - name: Resolve the application name
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(python -c 'import version; print(version.APP_NAME)')"
          [ -n "$NAME" ] || { echo "::error::version.APP_NAME is empty."; exit 1; }
          echo "app_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build the executables
        shell: bash
        run: |
          set -euo pipefail
          python installer/build_windows.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ inputs.tag }}"

      - name: Smoke-test the setup executable
        shell: pwsh
        env:
          APP_NAME: ${{ steps.identity.outputs.app_name }}
        run: |
          # A frozen entry point that cannot import its own package exits
          # instantly and silently; catching that here beats shipping it.
          #
          # ``--self-test`` builds the wizard offscreen and returns, so this
          # asserts on an exit code.  Waiting for a *visible* window is what
          # this step used to do, and it does not work on a hosted runner:
          # the window station is not interactive, so the process stays alive
          # with an empty MainWindowTitle and the step fails on a healthy
          # build.  A onefile bundle also has to unpack itself before any of
          # this runs, hence the generous timeout.
          $exe = "dist/setup/$env:APP_NAME-Setup.exe"
          if (-not (Test-Path $exe)) { throw "The build did not produce $exe." }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            throw "The setup executable did not finish its self-test within 120s."
          }
          if ($p.ExitCode -ne 0) {
            throw "The setup executable failed its self-test with exit code $($p.ExitCode)."
          }
          Write-Host "Self-test passed."

      - name: Check the installer pipeline is runnable
        shell: bash
        run: python -m installer.steps --probe

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload }}
        with:
          name: windows-setup
          # The launcher is embedded in the setup executable by build_setup's
          # --add-data, so shipping it beside the wizard would put a second,
          # non-functional entry point on the release page.
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error
